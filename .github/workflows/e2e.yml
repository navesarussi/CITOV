name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run Playwright against production
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://citov.tech' }}
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
        run: npx playwright test
      - name: Report results to app
        if: always()
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://citov.tech' }}
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
        run: |
          STATUS="${{ job.status }}"
          curl -sS -X POST "$E2E_BASE_URL/api/e2e/report" \
            -H "content-type: application/json" \
            -H "x-e2e-secret: $E2E_SECRET" \
            -d "{\"ok\":$([ \"$STATUS\" = \"success\" ] && echo true || echo false),\"workflow\":\"e2e.yml\",\"status\":\"$STATUS\",\"runUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
