name: Prompt regression

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/infrastructure/ai/**"
      - "src/application/extraction-eval.ts"
      - "src/domain/extraction-evidence.ts"
      - "eval/extraction/**"
      - "eval/matching/**"
      - "eval/ci/**"
      - "scripts/ci-prompt-regression.ts"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Extraction + matching thresholds
        run: npm run ci:prompt-regression
      - name: PR comment (Hebrew summary)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync(process.env.GITHUB_STEP_SUMMARY)
              ? fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8')
              : 'בדיקת רגרסיה — ראו לוג job.';
            const marker = '<!-- prompt-regression -->';
            const full = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }
